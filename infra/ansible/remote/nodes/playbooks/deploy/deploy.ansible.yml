---
- import_playbook: configure.ansible.yml

- name: Create directories on remote hosts
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Create metagraph-l0 directory
      file:
        path: /home/{{ ansible_user }}/code/metagraph-l0
        state: directory
      async: 300
      poll: 0

    - name: Create currency-l1 directory
      file:
        path: /home/{{ ansible_user }}/code/currency-l1
        state: directory
      async: 300
      poll: 0

    - name: Create data-l1 directory
      file:
        path: /home/{{ ansible_user }}/code/data-l1
        state: directory
      async: 300
      poll: 0

- name: Send JARs to remote hosts
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Sending cl-keytool.jar to nodes
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/jars/cl-keytool.jar"
        dest: /home/{{ ansible_user }}/code

    - name: Sending cl-wallet.jar to nodes
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/jars/cl-wallet.jar"
        dest: /home/{{ ansible_user }}/code

    - name: Copy cl-keytool.jar and cl-wallet.jar files to metagraph-l0
      shell: |
        cp /home/{{ ansible_user }}/code/cl-keytool.jar /home/{{ ansible_user }}/code/metagraph-l0
        cp /home/{{ ansible_user }}/code/cl-wallet.jar /home/{{ ansible_user }}/code/metagraph-l0

    - name: Copy cl-keytool.jar and cl-wallet.jar files to currency-l1
      shell: |
        cp /home/{{ ansible_user }}/code/cl-keytool.jar /home/{{ ansible_user }}/code/currency-l1
        cp /home/{{ ansible_user }}/code/cl-wallet.jar /home/{{ ansible_user }}/code/currency-l1
      when: deploy_cl1 | bool

    - name: Copy cl-keytool.jar and cl-wallet.jar files to data-l1
      shell: |
        cp /home/{{ ansible_user }}/code/cl-keytool.jar /home/{{ ansible_user }}/code/data-l1
        cp /home/{{ ansible_user }}/code/cl-wallet.jar /home/{{ ansible_user }}/code/data-l1
      when: deploy_dl1 | bool

    - name: Sending metagraph-l0.jar to metagraph-l0
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/jars/metagraph-l0.jar"
        dest: /home/{{ ansible_user }}/code/metagraph-l0

    - name: Sending currency-l1.jar to currency-l1
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/jars/currency-l1.jar"
        dest: /home/{{ ansible_user }}/code/currency-l1/currency-l1.jar
      when: deploy_cl1 | bool

    - name: Sending data-l1.jar to data-l1
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/jars/data-l1.jar"
        dest: /home/{{ ansible_user }}/code/data-l1/data-l1.jar
      when: deploy_dl1 | bool

    - name: Cleaning jars
      shell: |
        rm -f /home/{{ ansible_user }}/code/cl-keytool.jar
        rm -f /home/{{ ansible_user }}/code/cl-wallet.jar

- name: Send genesis information to remote hosts
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Check if genesis.csv exists
      stat:
        path: /home/{{ ansible_user }}/code/metagraph-l0/genesis.csv
      register: genesis_csv_file_stat

    - name: Sending metagraph l0 genesis.csv to metagraph-l0
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/metagraph-l0/genesis/genesis.csv"
        dest: /home/{{ ansible_user }}/code/metagraph-l0
      when: (force_genesis | bool) or (not genesis_csv_file_stat.stat.exists)

    - name: Check if genesis.snapshot exists
      stat:
        path: /home/{{ ansible_user }}/code/metagraph-l0/genesis.snapshot
        checksum_algorithm: sha256
      register: genesis_snapshot_file_stat

    - name: Check if genesis.address exists
      stat:
        path: /home/{{ ansible_user }}/code/metagraph-l0/genesis.address
        checksum_algorithm: sha256
      register: genesis_address_file_stat

    - name: Check if genesis provenance exists
      stat:
        path: /home/{{ ansible_user }}/code/metagraph-l0/genesis.provenance.json
      register: genesis_provenance_file_stat

    - name: Determine whether the remote genesis is complete
      set_fact:
        remote_genesis_complete: >-
          {{
            genesis_snapshot_file_stat.stat.exists and
            genesis_address_file_stat.stat.exists and
            genesis_provenance_file_stat.stat.exists
          }}
        remote_genesis_absent: >-
          {{
            not genesis_snapshot_file_stat.stat.exists and
            not genesis_address_file_stat.stat.exists and
            not genesis_provenance_file_stat.stat.exists
          }}

    - name: Refuse to update an incomplete remote genesis without force_genesis
      fail:
        msg: >-
          The remote genesis is incomplete: genesis.address, genesis.snapshot, and
          genesis.provenance.json must be deployed together. Regenerate the local files with
          'hydra create-remote-genesis', then run 'hydra remote-deploy --force_genesis'.
      when:
        - not (force_genesis | bool)
        - not (remote_genesis_complete | bool)
        - not (remote_genesis_absent | bool)

    - name: Determine whether to deploy genesis files
      set_fact:
        should_deploy_genesis: "{{ (force_genesis | bool) or (remote_genesis_absent | bool) }}"

    - name: Check local genesis.address
      stat:
        path: "{{ lookup('env', 'INFRA_PATH') }}/shared/genesis/genesis.address"
        checksum_algorithm: sha256
      register: local_genesis_address
      delegate_to: localhost
      when: should_deploy_genesis

    - name: Check local genesis.snapshot
      stat:
        path: "{{ lookup('env', 'INFRA_PATH') }}/shared/genesis/genesis.snapshot"
        checksum_algorithm: sha256
      register: local_genesis_snapshot
      delegate_to: localhost
      when: should_deploy_genesis

    - name: Check local genesis provenance
      stat:
        path: "{{ lookup('env', 'INFRA_PATH') }}/shared/genesis/genesis.provenance.json"
      register: local_genesis_provenance
      delegate_to: localhost
      when: should_deploy_genesis

    - name: Require a complete local genesis
      assert:
        that:
          - local_genesis_address.stat.exists
          - local_genesis_snapshot.stat.exists
          - local_genesis_provenance.stat.exists
        fail_msg: >-
          infra/shared/genesis must contain genesis.address, genesis.snapshot, and
          genesis.provenance.json. Generate them with 'hydra create-remote-genesis'.
      when: should_deploy_genesis

    - name: Read local genesis provenance
      slurp:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/genesis/genesis.provenance.json"
      register: local_genesis_provenance_file
      delegate_to: localhost
      when: should_deploy_genesis

    - name: Parse local genesis provenance
      set_fact:
        local_genesis_provenance_data: "{{ local_genesis_provenance_file.content | b64decode | from_json }}"
      when: should_deploy_genesis

    - name: Validate local genesis provenance
      assert:
        that:
          - (local_genesis_provenance_data.version | default(0) | int) == 1
          - (local_genesis_provenance_data.network | default('')) == lookup('env', 'DEPLOY_NETWORK_NAME')
          - (local_genesis_provenance_data.address_sha256 | default('')) == local_genesis_address.stat.checksum
          - (local_genesis_provenance_data.snapshot_sha256 | default('')) == local_genesis_snapshot.stat.checksum
        fail_msg: >-
          The local genesis provenance does not match the target network or artifact checksums.
          Regenerate all genesis files with 'hydra create-remote-genesis'. Note: this produces a
          new metagraph ID.
      when: should_deploy_genesis

    - name: Sending metagraph l0 genesis.snapshot to metagraph-l0
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/genesis/genesis.snapshot"
        dest: /home/{{ ansible_user }}/code/metagraph-l0/genesis.snapshot
      when: should_deploy_genesis

    - name: Sending metagraph l0 genesis.address to metagraph-l0
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/genesis/genesis.address"
        dest: /home/{{ ansible_user }}/code/metagraph-l0/genesis.address
      when: should_deploy_genesis

    # Copy provenance last. If either artifact copy fails, an older provenance file cannot
    # attest to the partially updated pair.
    - name: Sending genesis provenance to metagraph-l0
      copy:
        src: "{{ lookup('env', 'INFRA_PATH') }}/shared/genesis/genesis.provenance.json"
        dest: /home/{{ ansible_user }}/code/metagraph-l0/genesis.provenance.json
      when: should_deploy_genesis

    - name: Check deployed genesis.address
      stat:
        path: /home/{{ ansible_user }}/code/metagraph-l0/genesis.address
        checksum_algorithm: sha256
      register: deployed_genesis_address

    - name: Check deployed genesis.snapshot
      stat:
        path: /home/{{ ansible_user }}/code/metagraph-l0/genesis.snapshot
        checksum_algorithm: sha256
      register: deployed_genesis_snapshot

    - name: Read deployed genesis provenance
      slurp:
        src: /home/{{ ansible_user }}/code/metagraph-l0/genesis.provenance.json
      register: deployed_genesis_provenance_file

    - name: Parse deployed genesis provenance
      set_fact:
        deployed_genesis_provenance: "{{ deployed_genesis_provenance_file.content | b64decode | from_json }}"

    - name: Validate deployed genesis provenance
      assert:
        that:
          - (deployed_genesis_provenance.version | default(0) | int) == 1
          - (deployed_genesis_provenance.network | default('')) == lookup('env', 'DEPLOY_NETWORK_NAME')
          - (deployed_genesis_provenance.address_sha256 | default('')) == deployed_genesis_address.stat.checksum
          - (deployed_genesis_provenance.snapshot_sha256 | default('')) == deployed_genesis_snapshot.stat.checksum
        fail_msg: >-
          The deployed genesis files do not match their provenance or the target network.
          Refusing to leave an unverified genesis on this host.
      
- name: Send p12 files to remote node-1
  hosts: node-1
  gather_facts: false
  vars:
     all_nodes: "{{ lookup('env', 'NODES') | from_json }}"
  tasks:
    - name: Sending p12 file to node 1
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ all_nodes[0].key_file.name }}"
        dest: /home/{{ ansible_user }}/code

    - name: Copy p12 file to metagraph-l0
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[0].key_file.name }} /home/{{ ansible_user }}/code/metagraph-l0

    - name: Copy key file to currency-l1
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[0].key_file.name }} /home/{{ ansible_user }}/code/currency-l1

    - name: Copy key file to data-l1
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[0].key_file.name }} /home/{{ ansible_user }}/code/data-l1

    - name: Cleaning file
      shell: |
        rm -f /home/{{ ansible_user }}/code/{{ all_nodes[0].key_file.name }}

- name: Send p12 files to remote node-2
  hosts: node-2
  gather_facts: false
  vars:
     all_nodes: "{{ lookup('env', 'NODES') | from_json }}"
  tasks:
    - name: Sending p12 file to node 2
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ all_nodes[1].key_file.name }}"
        dest: /home/{{ ansible_user }}/code

    - name: Copy p12 file to metagraph-l0
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[1].key_file.name }} /home/{{ ansible_user }}/code/metagraph-l0

    - name: Copy key file to currency-l1
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[1].key_file.name }} /home/{{ ansible_user }}/code/currency-l1

    - name: Copy key file to data-l1
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[1].key_file.name }} /home/{{ ansible_user }}/code/data-l1

    - name: Cleaning file
      shell: |
        rm -f /home/{{ ansible_user }}/code/{{ all_nodes[0].key_file.name }}

- name: Send p12 files to remote node-3
  hosts: node-3
  gather_facts: false
  vars:
     all_nodes: "{{ lookup('env', 'NODES') | from_json }}"
  tasks:
    - name: Sending p12 file to node 3
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ all_nodes[2].key_file.name }}"
        dest: /home/{{ ansible_user }}/code

    - name: Copy p12 file to metagraph-l0
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[2].key_file.name }} /home/{{ ansible_user }}/code/metagraph-l0

    - name: Copy key file to currency-l1
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[2].key_file.name }} /home/{{ ansible_user }}/code/currency-l1

    - name: Copy key file to data-l1
      shell: |
        cp /home/{{ ansible_user }}/code/{{ all_nodes[2].key_file.name }} /home/{{ ansible_user }}/code/data-l1
      
    - name: Cleaning file
      shell: |
        rm -f /home/{{ ansible_user }}/code/{{ all_nodes[0].key_file.name }}

- name: Send primary snapshot fee p12 file to nodes
  hosts: nodes
  gather_facts: false
  vars:
     owner_p12_file_name: "{{ owner_p12_file_name }}"
     staking_p12_file_name: "{{ staking_p12_file_name }}"
  tasks:
    - name: Check if owner file exists
      stat:
        path: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ owner_p12_file_name }}"
      register: owner_p12_file
      delegate_to: localhost
      when: not (owner_p12_file_name is undefined or owner_p12_file_name == "")

    - name: Copy owner file to remote node
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ owner_p12_file_name }}"
        dest: "/home/{{ ansible_user }}/code/metagraph-l0/{{ owner_p12_file_name }}"
      when: not (owner_p12_file_name is undefined or owner_p12_file_name == "") and owner_p12_file.stat.exists

    - name: Check if staking file exists
      stat:
        path: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ staking_p12_file_name }}"
      register: staking_p12_file
      when: not (staking_p12_file_name is undefined or staking_p12_file_name == "")
      delegate_to: localhost

    - name: Copy staking file to remote node if it exists
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ staking_p12_file_name }}"
        dest: "/home/{{ ansible_user }}/code/metagraph-l0/{{ staking_p12_file_name }}"
      when: not (staking_p12_file_name is undefined or staking_p12_file_name == "") and staking_p12_file.stat.exists

- name: Send the second signer .p12 file for snapshot fee to nodes
  hosts: nodes
  gather_facts: false
  vars:
     second_signer_p12_file_name_owner: "{{ second_signer_p12_file_name_owner }}"
     second_signer_p12_file_name_staking: "{{ second_signer_p12_file_name_staking }}"
  tasks:
    - name: Check if second signer file exists - owner
      stat:
        path: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ second_signer_p12_file_name_owner }}"
      register: owner_p12_file
      delegate_to: localhost
      when: not (second_signer_p12_file_name_owner is undefined or second_signer_p12_file_name_owner == "")

    - name: Copy second signer file to remote node - owner
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ second_signer_p12_file_name_owner }}"
        dest: "/home/{{ ansible_user }}/code/metagraph-l0/{{ second_signer_p12_file_name_owner }}"
      when: not (second_signer_p12_file_name_owner is undefined or second_signer_p12_file_name_owner == "") and owner_p12_file.stat.exists

    - name: Check if second signer file exists - staking
      stat:
        path: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ second_signer_p12_file_name_staking }}"
      register: staking_p12_file
      when: not (second_signer_p12_file_name_staking is undefined or second_signer_p12_file_name_staking == "")
      delegate_to: localhost

    - name: Copy second signer file to remote node if it exists - staking
      copy:
        src: "{{ lookup('env', 'SOURCE_PATH') }}/p12-files/{{ second_signer_p12_file_name_staking }}"
        dest: "/home/{{ ansible_user }}/code/metagraph-l0/{{ second_signer_p12_file_name_staking }}"
      when: not (second_signer_p12_file_name_staking is undefined or second_signer_p12_file_name_staking == "") and staking_p12_file.stat.exists
