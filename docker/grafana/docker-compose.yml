# docker-compose.yml
# We should let the IP address fixed, because the DNS do not work correctly when joining L1 nodes
services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    command:
      - --storage.tsdb.path=/prometheus/data
      - --storage.tsdb.retention.time=200h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus:/prometheus
    networks:
      custom-network:
        ipv4_address: 172.60.0.7
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:latest
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/config:/etc/grafana/provisioning
      - ./grafana/storage:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=natel-discrete-panel
    networks:
      custom-network:
        ipv4_address: 172.60.0.8
  burn-exporter:
    container_name: burn-exporter
    build: ./burn-exporter
    restart: unless-stopped
    environment:
      # Current cluster's metagraph L0 (node-1) + metagraph id. Supply/burn metrics work
      # regardless of id; only the balance metric uses METAGRAPH_ID (update on re-genesis).
      - META_L0_URL=http://172.60.0.10:8200
      - METAGRAPH_ID=DAG1gkPw7bjMVpZ3pkFwTTBSKVfpQURBQUVopKSQ
    networks:
      custom-network:
        ipv4_address: 172.60.0.9
networks:
  custom-network:
    external: true