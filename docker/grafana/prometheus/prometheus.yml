global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Burn demo supply/burn metrics (sidecar exporter polling the metagraph L0 HTTP API).
  - job_name: burn-exporter
    static_configs:
      - targets:
          - 172.60.0.9:9464

  # Metagraph node /metrics (consensus + snapshot gauges) for the stock dashboards.
  # Targets are this cluster's custom-network (172.60.0.0/24) layer ports.
  - job_name: metagraph-nodes
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.60.0.10:8000  # node-1 global-l0
          - 172.60.0.10:8100  # node-1 dag-l1
          - 172.60.0.10:8200  # node-1 metagraph-l0
          - 172.60.0.10:8300  # node-1 currency-l1
          - 172.60.0.10:8400  # node-1 data-l1
          - 172.60.0.20:8200  # node-2 metagraph-l0
          - 172.60.0.30:8200  # node-3 metagraph-l0
